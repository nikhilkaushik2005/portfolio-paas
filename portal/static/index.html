<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoFolio | Automated Portfolio Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Ambient Background Glow */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(8, 145, 178, 0.15), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(124, 58, 237, 0.15), transparent 25%);
            background-color: #0f172a; 
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
    </style>
</head>
<body class="text-slate-200 antialiased min-h-screen flex items-center justify-center p-4 md:p-8 pb-40 selection:bg-cyan-500 selection:text-white relative">

    <div class="ambient-bg"></div>

    <div class="w-full max-w-5xl bg-slate-900/60 backdrop-blur-xl rounded-3xl border border-slate-700/50 shadow-[0_0_50px_rgba(0,0,0,0.5)] p-6 md:p-12 relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-600 via-cyan-400 to-purple-600"></div>

        <header class="text-center mb-10 md:mb-14">
            <h1 class="text-5xl md:text-6xl font-black tracking-tight mb-4 text-white">
                Auto<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Folio</span>
            </h1>
            <p class="text-slate-400 font-medium tracking-wide text-base md:text-lg uppercase">PaaS Engine Control Panel</p>
        </header>

        <form id="deployForm" class="space-y-10 md:space-y-12">
            
            <div class="bg-slate-800/40 p-8 rounded-2xl border border-slate-700/50">
                <h2 class="text-sm md:text-base font-bold text-cyan-400 uppercase tracking-widest mb-6 flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></span> Core Identity
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm md:text-base text-slate-400 mb-2 uppercase tracking-wide">Display Name</label>
                        <input type="text" id="name" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all placeholder-slate-600 shadow-inner text-base md:text-lg" placeholder="e.g. Nikhil Kaushik">
                    </div>
                    <div>
                        <label class="block text-sm md:text-base text-slate-400 mb-2 uppercase tracking-wide">Headline</label>
                        <input type="text" id="bio" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all placeholder-slate-600 shadow-inner text-base md:text-lg" placeholder="e.g. Cloud Architect & DevOps">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm md:text-base text-slate-400 mb-2 uppercase tracking-wide">Tech Stack (Comma Separated)</label>
                        <input type="text" id="skills" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all placeholder-slate-600 shadow-inner text-base md:text-lg" placeholder="e.g. Python, AWS, Terraform, Docker">
                    </div>
                </div>
            </div>

            <div class="bg-slate-800/40 p-8 rounded-2xl border border-slate-700/50">
                <h2 class="text-sm md:text-base font-bold text-cyan-400 uppercase tracking-widest mb-6 flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-blue-400"></span> Connectivity
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm md:text-base text-slate-400 mb-2 uppercase tracking-wide">Email Address <span class="text-red-400 normal-case tracking-normal ml-1">* Required</span></label>
                        <input type="email" id="email" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all text-base md:text-lg" placeholder="hello@example.com">
                    </div>
                    <div>
                        <label class="block text-sm md:text-base text-slate-400 mb-2 uppercase tracking-wide">Resume Link (PDF) <span class="text-slate-600 normal-case tracking-normal ml-1">- Optional</span></label>
                        <input type="url" id="resume" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all text-base md:text-lg" placeholder="https://drive.google.com/...">
                    </div>
                    <div>
                        <label class="block text-sm md:text-base text-slate-400 mb-2 uppercase tracking-wide">GitHub URL <span class="text-slate-600 normal-case tracking-normal ml-1">- Optional</span></label>
                        <input type="url" id="github" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all text-base md:text-lg" placeholder="https://github.com/...">
                    </div>
                    <div>
                        <label class="block text-sm md:text-base text-slate-400 mb-2 uppercase tracking-wide">LinkedIn URL <span class="text-slate-600 normal-case tracking-normal ml-1">- Optional</span></label>
                        <input type="url" id="linkedin" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all text-base md:text-lg" placeholder="https://linkedin.com/in/...">
                    </div>
                </div>
            </div>

            <div class="bg-gradient-to-br from-cyan-900/20 to-blue-900/20 p-8 rounded-2xl border border-cyan-700/40 shadow-[inset_0_0_20px_rgba(8,145,178,0.1)]">
                <label class="block text-base md:text-lg font-bold text-cyan-300 mb-4 tracking-wide">Target Architecture (Theme)</label>
                <div class="relative">
                    <select id="templateChoice" class="w-full appearance-none bg-slate-900 border border-cyan-700/50 rounded-xl px-5 py-5 pr-10 text-white text-base md:text-lg font-semibold focus:outline-none focus:ring-2 focus:ring-cyan-400 transition-all cursor-pointer hover:border-cyan-500">
                        <option value="1">Template 1: Dark Mode Glass-morphism (Pro)</option>
                        <option value="2">Template 2: Retro Hacker Terminal</option>
                        <option value="3">Template 3: Premium Cyber-Glass (Animated)</option>
                        <option value="4">Template 4: Pink Editorial Minimalist</option>
                        <option value="5">Template 5: Kinetic Editorial</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-cyan-400">
                        <svg class="fill-current h-6 w-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-6 px-2">
                    <h3 class="text-xl md:text-2xl font-bold text-white tracking-wide">Featured Projects</h3>
                    <button type="button" onclick="addProject()" class="text-sm md:text-base bg-slate-800 hover:bg-slate-700 border border-slate-600 px-5 py-2.5 rounded-full text-white transition-all hover:border-cyan-500 flex items-center gap-2 shadow-sm">
                        <span class="text-cyan-400 font-bold text-lg leading-none">+</span> Add Project
                    </button>
                </div>
                <div id="projects-container" class="space-y-5">
                    <div class="project-entry grid grid-cols-1 md:grid-cols-12 gap-4 p-6 bg-slate-800/40 border border-slate-700/50 rounded-2xl relative group transition-all duration-300">
                        <button type="button" onclick="this.parentElement.remove()" class="absolute -top-3 -right-2 bg-red-900/80 hover:bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border border-red-500 shadow-lg transition-all opacity-100 md:opacity-0 md:group-hover:opacity-100 z-10">✕</button>
                        <input type="text" placeholder="Project Title" class="proj-title w-full md:col-span-4 bg-slate-900/50 rounded-lg px-4 py-3 border border-slate-700 focus:ring-1 focus:ring-cyan-500 outline-none text-base md:text-lg" required>
                        <input type="text" placeholder="Tech Stack" class="proj-tech w-full md:col-span-3 bg-slate-900/50 rounded-lg px-4 py-3 border border-slate-700 focus:ring-1 focus:ring-cyan-500 outline-none text-base md:text-lg" required>
                        <input type="text" placeholder="Short Description" class="proj-desc w-full md:col-span-5 bg-slate-900/50 rounded-lg px-4 py-3 border border-slate-700 focus:ring-1 focus:ring-cyan-500 outline-none text-base md:text-lg" required>
                    </div>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-6 px-2">
                    <h3 class="text-xl md:text-2xl font-bold text-white tracking-wide">Experience Timeline</h3>
                    <button type="button" onclick="addExperience()" class="text-sm md:text-base bg-slate-800 hover:bg-slate-700 border border-slate-600 px-5 py-2.5 rounded-full text-white transition-all hover:border-blue-500 flex items-center gap-2 shadow-sm">
                        <span class="text-blue-400 font-bold text-lg leading-none">+</span> Add Role
                    </button>
                </div>
                <div id="exp-container" class="space-y-5">
                    <div class="exp-entry grid grid-cols-1 md:grid-cols-3 gap-4 p-6 bg-slate-800/40 border border-slate-700/50 rounded-2xl relative group transition-all duration-300">
                        <button type="button" onclick="this.parentElement.remove()" class="absolute -top-3 -right-2 bg-red-900/80 hover:bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border border-red-500 shadow-lg transition-all opacity-100 md:opacity-0 md:group-hover:opacity-100 z-10">✕</button>
                        <input type="text" placeholder="Role" class="exp-role w-full bg-slate-900/50 rounded-lg px-4 py-3 border border-slate-700 focus:ring-1 focus:ring-blue-500 outline-none text-base md:text-lg" required>
                        <input type="text" placeholder="Organization" class="exp-org w-full bg-slate-900/50 rounded-lg px-4 py-3 border border-slate-700 focus:ring-1 focus:ring-blue-500 outline-none text-base md:text-lg" required>
                        <input type="text" placeholder="Duration" class="exp-date w-full bg-slate-900/50 rounded-lg px-4 py-3 border border-slate-700 focus:ring-1 focus:ring-blue-500 outline-none text-base md:text-lg" required>
                    </div>
                </div>
            </div>

            <button type="submit" id="deployBtn" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold py-5 rounded-xl shadow-[0_0_20px_rgba(8,145,178,0.3)] hover:shadow-[0_0_30px_rgba(8,145,178,0.5)] hover:-translate-y-1 transition-all duration-300 text-xl md:text-2xl uppercase tracking-wider mt-6 border border-cyan-400/30">
                🚀 Initiate Launch Sequence
            </button>
        </form>
    </div>

    <div id="resultBanner" class="fixed bottom-0 left-0 w-full transform translate-y-full transition-transform duration-500 z-50 p-4 pb-8 flex justify-center pointer-events-none">
        <div class="pointer-events-auto w-full max-w-5xl bg-slate-900/95 backdrop-blur-2xl border border-emerald-500/50 shadow-[0_-15px_50px_rgba(16,185,129,0.3)] rounded-2xl p-6 md:p-8 flex flex-col md:flex-row items-center justify-between gap-6 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-400 via-teal-500 to-emerald-400 bg-[length:200%_auto] animate-[textFlow_2s_linear_infinite]"></div>
            
            <div class="flex-grow w-full md:w-auto text-center md:text-left">
                <h3 id="bannerTitle" class="text-xl md:text-2xl font-bold text-emerald-400 mb-2 flex items-center justify-center md:justify-start gap-3">
                    <span id="statusDot" class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_10px_#34d399]"></span> 
                    <span id="statusText">Building Architecture...</span>
                </h3>
                <p id="bannerSubtitle" class="text-slate-400 text-sm md:text-base font-bold tracking-wide flex items-center justify-center md:justify-start gap-2">
                    <svg class="w-5 h-5 animate-spin text-emerald-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    Estimated time remaining: <span id="countdownTimer" class="text-white font-mono text-lg ml-1">02:00</span>
                </p>
            </div>

            <div id="linkActions" class="hidden w-full md:w-auto shrink-0 flex-col md:flex-row items-center gap-3">
                <a id="liveLink" href="#" target="_blank" class="px-6 py-4 bg-slate-950 border border-slate-600 hover:border-emerald-500 text-white font-mono text-sm md:text-base rounded-xl transition-all truncate w-full md:w-[22rem] text-center md:text-left hover:text-emerald-400"></a>
                
                <button type="button" onclick="copyLink()" id="copyBtn" class="w-full md:w-auto px-6 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-all flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <span id="copyBtnText">Copy URL</span>
                </button>
            </div>
            
            <button type="button" onclick="closeBanner()" class="absolute top-4 right-4 text-slate-500 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </div>

    <script>
        function addProject() {
            const container = document.getElementById('projects-container');
            const html = `
                <div class="project-entry grid grid-cols-1 md:grid-cols-12 gap-4 p-6 bg-slate-800/40 border border-slate-700/50 rounded-2xl relative group transition-all duration-300">
                    <button type="button" onclick="this.parentElement.remove()" class="absolute -top-3 -right-2 bg-red-900/80 hover:bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border border-red-500 shadow-lg transition-all opacity-100 md:opacity-0 md:group-hover:opacity-100 z-10">✕</button>
                    <input type="text" placeholder="Project Title" class="proj-title w-full md:col-span-4 bg-slate-900/50 rounded-lg px-4 py-3 border border-slate-700 focus:ring-1 focus:ring-cyan-500 outline-none text-base md:text-lg" required>
                    <input type="text" placeholder="Tech Stack" class="proj-tech w-full md:col-span-3 bg-slate-900/50 rounded-lg px-4 py-3 border border-slate-700 focus:ring-1 focus:ring-cyan-500 outline-none text-base md:text-lg" required>
                    <input type="text" placeholder="Short Description" class="proj-desc w-full md:col-span-5 bg-slate-900/50 rounded-lg px-4 py-3 border border-slate-700 focus:ring-1 focus:ring-cyan-500 outline-none text-base md:text-lg" required>
                </div>`;
            container.insertAdjacentHTML('beforeend', html);
        }

        function addExperience() {
            const container = document.getElementById('exp-container');
            const html = `
                <div class="exp-entry grid grid-cols-1 md:grid-cols-3 gap-4 p-6 bg-slate-800/40 border border-slate-700/50 rounded-2xl relative group transition-all duration-300">
                    <button type="button" onclick="this.parentElement.remove()" class="absolute -top-3 -right-2 bg-red-900/80 hover:bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border border-red-500 shadow-lg transition-all opacity-100 md:opacity-0 md:group-hover:opacity-100 z-10">✕</button>
                    <input type="text" placeholder="Role" class="exp-role w-full bg-slate-900/50 rounded-lg px-4 py-3 border border-slate-700 focus:ring-1 focus:ring-blue-500 outline-none text-base md:text-lg" required>
                    <input type="text" placeholder="Organization" class="exp-org w-full bg-slate-900/50 rounded-lg px-4 py-3 border border-slate-700 focus:ring-1 focus:ring-blue-500 outline-none text-base md:text-lg" required>
                    <input type="text" placeholder="Duration" class="exp-date w-full bg-slate-900/50 rounded-lg px-4 py-3 border border-slate-700 focus:ring-1 focus:ring-blue-500 outline-none text-base md:text-lg" required>
                </div>`;
            container.insertAdjacentHTML('beforeend', html);
        }

        function copyLink() {
            const linkText = document.getElementById('liveLink').href;
            navigator.clipboard.writeText(linkText).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerHTML = `<span class="text-white">Copied! ✓</span>`;
                copyBtn.classList.replace('bg-emerald-600', 'bg-teal-600');
                setTimeout(() => {
                    copyBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg><span id="copyBtnText">Copy URL</span>`;
                    copyBtn.classList.replace('bg-teal-600', 'bg-emerald-600');
                }, 2000);
            });
        }

        function closeBanner() {
            document.getElementById('resultBanner').classList.add('translate-y-full');
        }

        document.getElementById('deployForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('deployBtn');
            btn.innerHTML = "<span class='animate-pulse'>⏳ Connecting to AWS...</span>"; 
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');

            const projects = Array.from(document.querySelectorAll('.project-entry')).map(entry => ({
                title: entry.querySelector('.proj-title').value,
                desc: entry.querySelector('.proj-desc').value,
                tech: entry.querySelector('.proj-tech').value
            }));

            const experience = Array.from(document.querySelectorAll('.exp-entry')).map(entry => ({
                role: entry.querySelector('.exp-role').value,
                org: entry.querySelector('.exp-org').value,
                date: entry.querySelector('.exp-date').value
            }));

            const data = {
                template_id: document.getElementById('templateChoice').value,
                name: document.getElementById('name').value,
                bio: document.getElementById('bio').value,
                skills: document.getElementById('skills').value,
                resume: document.getElementById('resume').value,
                github: document.getElementById('github').value,
                linkedin: document.getElementById('linkedin').value,
                email: document.getElementById('email').value,
                projects: projects,
                experience: experience
            };

            const formData = new FormData(); 
            formData.append('file', new Blob([JSON.stringify(data)], { type: 'application/json' }), 'student_data.json');

            try {
                const response = await fetch('/one-click-deploy', { method: 'POST', body: formData });
                const result = await response.json();
                
                // 1. Prepare Banner (Loading State)
                document.getElementById('liveLink').href = result.live_url;
                document.getElementById('liveLink').innerText = result.live_url;
                
                document.getElementById('linkActions').classList.add('hidden');
                document.getElementById('linkActions').classList.remove('flex');
                
                document.getElementById('statusText').innerText = "Building Architecture...";
                document.getElementById('statusDot').classList.add('animate-pulse');
                
                document.getElementById('bannerSubtitle').innerHTML = `
                    <svg class="w-5 h-5 animate-spin text-emerald-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    Estimated time remaining: <span id="countdownTimer" class="text-white font-mono text-lg ml-1">02:00</span>
                `;

                // 2. Reveal the Slide-up Banner
                document.getElementById('resultBanner').classList.remove('translate-y-full');
                
                btn.innerHTML = "✅ Deployment Initiated"; 
                btn.classList.remove('opacity-70', 'cursor-not-allowed', 'from-cyan-600', 'to-blue-600');
                btn.classList.add('from-emerald-600', 'to-teal-600');

                // 3. Start the 2-Minute Countdown Timer
                let timeLeft = 120;
                
                const countdown = setInterval(() => {
                    timeLeft--;
                    const minutes = Math.floor(timeLeft / 60);
                    const seconds = timeLeft % 60;
                    
                    const timerDisplay = document.getElementById('countdownTimer');
                    if(timerDisplay) {
                        timerDisplay.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    }

                    if (timeLeft <= 0) {
                        clearInterval(countdown);
                        
                        // 4. Timer Finished -> Reveal Link & Warning
                        document.getElementById('statusText').innerText = "Deployment Successful";
                        document.getElementById('statusDot').classList.remove('animate-pulse');
                        
                        document.getElementById('bannerSubtitle').innerHTML = `
                            <span class="text-red-400 font-bold flex items-center gap-2">
                                ⚠️ Link will be permanently lost upon page refresh. Copy it now.
                            </span>
                        `;

                        const actions = document.getElementById('linkActions');
                        actions.classList.remove('hidden');
                        actions.classList.add('flex', 'animate-[fadeIn_0.5s_ease-out]');
                    }
                }, 1000);

            } catch (error) {
                alert("Error triggering deployment.");
                btn.innerText = "🚀 Initiate Launch Sequence"; 
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
